const load = (src) => new Promise((ok, no) => new THREE.TextureLoader().load(src, ok, undefined, no));
async function materials() {
  const M = {}, X = VARIANT.look?.mat || {};
  const tex = async (name, rep = true) => {
    const t = await load(`../assets/source/castle3d/tex/${name}.png`);
    t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = rep ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
    t.anisotropy = 8; return t;

  const mk = async (name, o = {}) => {
    const map = await tex(name), bump = await tex(name);
    bump.colorSpace = THREE.NoColorSpace;
    return new THREE.MeshStandardMaterial({ map, bumpMap: bump, bumpScale: LOOK.bump, roughness: 0.92, metalness: 0, color: o.color ?? LOOK.tone, side: THREE.FrontSide });
  };

  const pick = async (k, tex, color) => (X[k] ? mk(X[k][0], { color: X[k][1] }) : mk(tex, color == null ? {} : { color }));
  M.ashlar = await pick('ashlar', 'ashlar');
  M.walk = await pick('walk', 'ashlar', 0x9a948c);
  M.setts = await pick('setts', 'ashlar', 0x8c8780);
  M.lead = await mk('slate', { color: 0x7c8088 });
  M.glass = new THREE.MeshStandardMaterial({ color: 0x15171d, roughness: 0.35, metalness: 0.2 });
  M.slit = new THREE.MeshStandardMaterial({ color: 0x0c0b0a, roughness: 1 });
  M.marble = await pick('marble', 'chapel', 0xfff6e8);
  M.chapel = await pick('chapel', 'chapel');
  M.slate = await pick('slate', 'slate', 0xe6e9f0);
  M.wood = await pick('wood', 'wood', 0xc8c0b8);

      for (let r = 0; r < h; r++) for (let x = 0; x < w; x++) if (buf[((h - 1 - r) * w + x) * 4 + 3] > 127) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, r); y1 = Math.max(y1, r); }
      if (x1 < 0) { x0 = y0 = 0; x1 = y1 = 0; }
      const cw = x1 - x0 + 1, ch = y1 - y0 + 1, data = new Uint8ClampedArray(cw * ch * 4);
      for (let r = 0; r < ch; r++) for (let x = 0; x < cw; x++) {
        const s = ((h - 1 - (y0 + r)) * w + x0 + x) * 4, d = (r * cw + x) * 4;
        if (buf[s + 3] > 127) { data[d] = buf[s]; data[d + 1] = buf[s + 1]; data[d + 2] = buf[s + 2]; data[d + 3] = 255; }
      }
      out.push({ w: cw, h: ch, ox: sx0 + x0 / S - (anchor[0] - anchor[1]) * 32, oy: sy0 + y0 / S - (anchor[0] + anchor[1]) * 16, data });
    }
    return out;
  };
  const D = layout.drawbridge, N = 9;
  const res = { drawbridge: null, portcullis: null, doors: [] };
  const ease = (k) => k / (N - 1);
  res.drawbridge = { anchor: [(D.x0 + D.x1) / 2, D.hinge + 0.02], frames: shoot([...Array(N)].map((_, k) => drawbridgeFrame(M, D, Math.PI / 2 * (1 - ease(k)))), [(D.x0 + D.x1) / 2, D.hinge + 0.02], [D.x0 - 1, D.hinge - 2, D.x1 + 1, D.y1, 42]) };
  const py = (D.portcullis ?? 202.15) + 0.05;   // the portcullis groove, just inside the gate's mouth
  res.portcullis = { anchor: [(D.x0 + D.x1) / 2, py], frames: shoot([...Array(N)].map((_, k) => portcullisFrame(M, D, 16 * ease(k))), [(D.x0 + D.x1) / 2, py], [D.x0, py - 1.2, D.x1, py + 0.8, 40]) };
  layout.doors.forEach((d, i) => {
    const phis = [0, 0.3, 0.6, 0.9, 1.2, Math.PI / 2];
    const across = d.axis === 'x' ? d.y : d.x, along = d.axis === 'x' ? d.x : d.y;
    const box = d.axis === 'x' ? [along - d.w / 2 - 0.5, across - d.w / 2 - 0.5, along + d.w / 2 + 0.5, across + d.w / 2 + 0.5, d.lv + 18]
      : [across - d.w / 2 - 0.5, along - d.w / 2 - 0.5, across + d.w / 2 + 0.5, along + d.w / 2 + 0.5, d.lv + 18];
    res.doors.push({ i, anchor: [d.x, d.y], frames: shoot(phis.map((p) => doorFrame(M, d, p)), [d.x, d.y], box) });
  });
  scene.remove(masonry);
  return res;
}

async function bakeAll(S = 2) {
  const t0 = performance.now();
  const { pieces, renders, layout, M } = await bake(S);
  const roofs = bakeRoofs(M, layout, S), moving = bakeFrames(M, layout, S);
  const extra = [...roofs.flatMap((r) => r.strips), ...moving.drawbridge.frames, ...moving.portcullis.frames, ...moving.doors.flatMap((d) => d.frames)];
  const { uniq, tiles, pages } = packPieces(pieces, S, extra);
  return {
    S, renders, ms: Math.round(performance.now() - t0), tiles, roofs: roofs.map((r) => ({ bld: r.bld, strips: r.strips.map((s) => [s.id, s.col]) })),
    moving: { drawbridge: { anchor: moving.drawbridge.anchor, frames: moving.drawbridge.frames.map((f) => f.id) },
      portcullis: { anchor: moving.portcullis.anchor, frames: moving.portcullis.frames.map((f) => f.id) },
      doors: moving.doors.map((d) => ({ i: d.i, anchor: d.anchor, frames: d.frames.map((f) => f.id) })) },
    pieces: uniq.map((u) => [u.at[0], u.at[1], u.at[2], u.w, u.h, +u.ox.toFixed(3), +u.oy.toFixed(3)]),
    pages: pages.map((p) => { const c = document.createElement('canvas'); c.width = p.c.width; c.height = p.used; c.getContext('2d').drawImage(p.c, 0, 0); return c.toDataURL('image/png'); }),
  };
}

// ------------------------------------------------------------------ viewer
async function view() {
  const layout = castle3d(VARIANT), M = await materials();
  setup();
  const group = build(M, layout);
  scene.add(group);
  const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 10, 100000);
  cam.position.set(260 * TU, 260 * LU * 6, 300 * TU);
  const ctl = new OrbitControls(cam, renderer.domElement); ctl.target.set(169 * TU, 0, 140 * TU); ctl.update();
  renderer.setSize(innerWidth, innerHeight);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400 * TU, 400 * TU), new THREE.MeshStandardMaterial({ color: 0x3c4a2a, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(168 * TU, -0.5, 152 * TU); ground.receiveShadow = true; scene.add(ground);
  document.getElementById('hud').textContent = 'Castle 3D: drag to orbit';
  renderer.setAnimationLoop(() => { ctl.update(); const d = new THREE.Vector3(...LOOK.sunDir).normalize().transformDirection(cam.matrixWorld);
    sun.position.copy(ctl.target).addScaledVector(d, 8000); sun.target.position.copy(ctl.target); sun.target.updateMatrixWorld();
    Object.assign(sun.shadow.camera, { left: -6000, right: 6000, top: 6000, bottom: -6000, near: 10, far: 20000 }); sun.shadow.camera.updateProjectionMatrix();
    renderer.render(scene, cam); });
}
/** One framed view (roofs on), centred on tile (tx, ty): w x h world px at S render px each, on a grass ground. */
async function preview(tx, ty, w = 1400, h = 900, S = 1) {
  const layout = castle3d(VARIANT), M = await materials();
  if (!renderer) setup();
  const group = build(M, layout);
  scene.add(group);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400 * TU, 400 * TU), new THREE.MeshStandardMaterial({ color: 0x3a4628, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(168 * TU, -0.2, 152 * TU); ground.receiveShadow = true; scene.add(ground);
  const sx = (tx - ty) * 32 - w / 2, sy = (tx + ty) * 16 - h / 2 - 60;
  const cam = isoCamera(sx, sx + w, -sy, -(sy + h));
  aimSun(cam, sx, sy, w, h);
  renderer.setSize(w * S, h * S, false); renderer.shadowMap.enabled = true; renderer.setClearColor(0x1d1c22, 1);
  renderer.render(scene, cam);
  scene.remove(group, ground);
  return renderer.domElement.toDataURL('image/png');
}
/** Debug: the gate with the portcullis at `lift` and the drawbridge at `angle`, masonry visible. */
async function gateDebug(lift = 16, angle = 0.6) {
  const layout = castle3d(VARIANT), M = await materials();
  if (!renderer) setup();
  const group = build(M, layout, (p) => !p.roof), D = layout.drawbridge;
  const pc = portcullisFrame(M, D, lift), db = drawbridgeFrame(M, D, angle);
  scene.add(group, pc, db);
  const w = 500, h = 500, sx = (169 - 202) * 32 - w / 2, sy = (169 + 202) * 16 - h / 2 - 150;
  const cam = isoCamera(sx, sx + w, -sy, -(sy + h)); aimSun(cam, sx, sy, w, h);
  renderer.setSize(w * 2, h * 2, false); renderer.setClearColor(0x1d1c22, 1); renderer.shadowMap.enabled = true; renderer.render(scene, cam);
  scene.remove(group, pc, db);
  return renderer.domElement.toDataURL('image/png');
}
async function bboxDebug() {
  const layout = castle3d(VARIANT), M = await materials(), D = layout.drawbridge, out = {};
  for (const [k, a] of [['flat', 0], ['up', Math.PI / 2]]) { const g = drawbridgeFrame(M, D, a); g.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(g); out[k] = [b.min.x / TU, b.min.z / TU, b.min.y / LU, b.max.x / TU, b.max.z / TU, b.max.y / LU].map((v) => +v.toFixed(2)); }
  const pc = portcullisFrame(M, D, 0); const b = new THREE.Box3().setFromObject(pc); out.pc = [b.min.x / TU, b.min.z / TU, b.min.y / LU, b.max.x / TU, b.max.z / TU, b.max.y / LU].map((v) => +v.toFixed(2));
  return out;
}
async function doorDebug(i = 0, phi = 0.6) {
  const layout = castle3d(VARIANT), M = await materials(), d = layout.doors[i];
  if (!renderer) setup();
  const group = build(M, layout, (p) => !p.roof), df = doorFrame(M, d, phi);
  scene.add(group, df);
  const w = 360, h = 360, sx = (d.x - d.y) * 32 - w / 2, sy = (d.x + d.y) * 16 - h / 2 - 40;
  const cam = isoCamera(sx, sx + w, -sy, -(sy + h)); aimSun(cam, sx, sy, w, h);
  renderer.setSize(w * 2, h * 2, false); renderer.setClearColor(0x1d1c22, 1); renderer.shadowMap.enabled = true; renderer.render(scene, cam);
  scene.remove(group, df);
  return renderer.domElement.toDataURL('image/png');
}
const setVariant = (id) => { VARIANT = castleVariant(id); return VARIANT.id; };
window.CASTLE3D = { bakeAll, preview, castle3d, gateDebug, bboxDebug, doorDebug, setVariant };
if (!P.has('bake')) view();
