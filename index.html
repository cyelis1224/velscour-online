<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VELSCOUR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/ui/icon.png">
<link rel="apple-touch-icon" href="assets/ui/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/lobby.css">
<link rel="stylesheet" href="css/chat.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div id="hud-top-left">
      <div id="area-name"></div>
      <div id="area-sub"></div>
      <div id="hero-stats">
        <div class="hs-row"><span>Level</span><b id="hs-lvl"></b></div>
        <div class="hs-row"><span>Attack</span><b id="hs-atk"></b></div>
        <div class="hs-row"><span>DPS</span><b id="hs-dps"></b></div>
        <div class="hs-row hs-avg"><span>Avg DPS &middot; 30s</span><b id="hs-avg"></b></div>
        <canvas id="hs-spark" width="150" height="18"></canvas>
        <div class="hs-row hs-tally hs-first"><span>Player Deaths</span><b id="hs-deaths"></b></div>
        <div class="hs-row hs-tally"><span>Total Monsters Killed</span><b id="hs-kills"></b></div>
      </div>
      <div id="target-box" class="hidden"><canvas id="tb-pic" width="320" height="320"></canvas><div id="tb-info"><div id="tb-name"></div><div id="tb-track"><div id="tb-fill"></div></div><div id="tb-sub"></div></div></div>
      <div id="buff-row"></div>
      <div id="auto-status" class="hidden"></div>
      <div id="party-roster" class="hidden"></div>
    </div>
    <div id="hud-top-right">
      <div id="minimap-row">
        <button id="velscour-skull" type="button" title="Contact Velscour" aria-label="Contact Velscour">
          <img src="assets/ui/velscour_contact_skull.png" alt="" draggable="false">
        </button>
        <div id="minimap-wrap"><canvas id="minimap" width="200" height="188"></canvas><img id="minimap-ring" src="assets/ui/minimap_ring.webp" alt="" draggable="false"></div>
      </div>
      <div id="hud-btncol">
        <div id="hud-buttons">
          <button class="hbtn" data-act="inventory" title="Inventory and hero (I)"><img src="assets/ui/btn_bag.webp" alt="Bag" draggable="false"><b id="stat-badge" class="badge hidden"></b></button>
          <button class="hbtn" data-act="skills" title="Skill Tree (K)"><img src="assets/ui/btn_skills.webp" alt="Skills" draggable="false"><b id="sp-badge" class="badge hidden"></b></button>
          <button class="hbtn" data-act="book" title="Skill Book (B)"><img src="assets/ui/btn_book.webp" alt="Book" draggable="false"></button>
          <button class="hbtn" data-act="quest" title="Quest Log (Q)"><img src="assets/ui/btn_quest.webp" alt="Quest" draggable="false"></button>
          <button class="hbtn" data-act="auto" id="auto-btn" title="Auto-play (Alt+P): the hero plays on autopilot"><img src="assets/ui/btn_auto.webp" alt="Auto" draggable="false"></button>
          <button class="hbtn" data-act="menu" title="Menu (Esc)"><img src="assets/ui/btn_menu.webp" alt="Menu" draggable="false"></button>
        </div>
        <!-- the spectator's dials: auto-play's stance, the Greed lever, sealed treasures waiting in the bag -->
        <div id="hud-dials">
          <div id="stance" class="hidden" title="Auto-play's stance: how hard the hero presses in, when it drinks and when it runs"><button type="button" data-st="cautious">Cautious</button><button type="button" data-st="balanced">Balanced</button><button type="button" data-st="reckless">Reckless</button></div>
          <div id="greed"><button type="button" class="gr-btn" data-d="-1" aria-label="Lower the Greed lever">&minus;</button><span class="gr-lever"><span class="gr-label">Greed</span><span id="greed-pips"></span></span><button type="button" class="gr-btn" data-d="1" aria-label="Raise the Greed lever">+</button><span id="hoard"></span></div>
          <button id="sealed-btn" class="hidden" type="button" title="Break the seal on a sealed treasure"><i></i><span id="sealed-text"></span></button>
        </div>
      </div>
    </div>
    <div id="boss-bar" class="hidden"><div id="boss-name"></div><div id="boss-track"><div id="boss-fill"></div></div><div id="boss-sub"></div></div>
    <div id="sand-objective" class="hidden" aria-live="polite"><b id="sand-title"></b><span id="sand-beat"></span><span id="sand-progress"></span><span id="sand-timer"></span></div>
    <div id="center-msg"></div>
    <div id="levelup" class="hidden">
      <div class="lu-flash"></div>
      <div class="lu-burst"><div></div></div>
      <div class="lu-title">Level Up</div>
      <div class="lu-level"><span>Level</span><b id="lu-num"></b></div>
      <div class="lu-sub">+5 attribute points &middot; +1 skill point</div>
      <div class="lu-voice"><div id="lu-l1"></div><div id="lu-l2"></div></div>
    </div>
    <div id="log"></div>
    <div id="hud-bar">
      <div id="hud-rail"></div>
      <div id="xp-track"><div id="xp-fill"></div></div>
      <img id="hud-img" src="assets/ui/hud.webp" alt="" draggable="false">
      <div class="orb-cover" id="life-cover"><div class="orb-empty"></div></div>
      <div class="orb-cover" id="mana-cover"><div class="orb-empty"></div></div>
      <div class="orb-text" id="life-text"></div>
      <div class="orb-text" id="mana-text"></div>
      <div id="xp-text"></div>
      <div id="hud-slots"></div>
      <div id="gauge-box">
        <div id="gauge-buttons">
          <button id="madness-btn" class="hidden" title="Unleash MADNESS (G): double damage and double speed for 30 seconds">MADNESS</button>
          <button id="smite-btn" class="hidden" title="SMITE (F): arm it, then click or tap where the heavens should strike">SMITE</button>
        </div>
        <div id="gauge-container">
          <div id="barbarian-rage" class="class-gauge gauge-rage hidden" aria-label="Barbarian Rage"><div id="barbarian-rage-fill" class="gauge-fill"></div><span id="barbarian-rage-text" class="gauge-text">Rage 0%</span></div>
          <div id="mad-track" class="class-gauge gauge-madness" aria-label="Madness"><div id="mad-fill" class="gauge-fill"></div><span id="mad-text" class="gauge-text">Madness</span></div>
          <div id="smite-track" class="class-gauge gauge-smite" aria-label="Smite"><div id="smite-fill" class="gauge-fill"></div><span id="smite-text" class="gauge-text">Smite</span></div>
        </div>
      </div>
      <div id="madness" class="hidden" style="display:none" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Touch controls -->
  <div id="touch-ui" class="hidden">
    <div id="joy-base"><div id="joy-knob"></div></div>
    <div id="touch-buttons"></div>
  </div>

  <div id="panels"></div>
  <div id="screens"></div>
  <div id="tooltip" class="hidden"></div>
  <div id="drag-ghost" class="hidden"></div>
  <div id="loading"><div class="spinner"></div><div id="loading-bar"><div id="loading-fill"></div></div><div id="loading-text">Summoning the depths&hellip;</div></div>
</div>
<!-- three.js, fetched only when a level draws in 3D (the Serpentine Tower, src/gfx/tower3d.js) -->
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
